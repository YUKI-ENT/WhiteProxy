<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="960" viewBox="0 0 1400 960" role="img" aria-labelledby="title desc">
<title id="title">WhiteProxy 院内ネットワーク構成例</title>
<desc id="desc">VLAN1内にWhiteProxyを配置。オレンジはVLAN2の端末からルーターを介したWhiteProxyへの接続、緑はWhiteProxyからルーターを介したインターネットへの接続を表す。</desc>
<defs>
  <linearGradient id="page" x2="0" y2="1"><stop stop-color="#f8fafc"/><stop offset="1" stop-color="#eef3f9"/></linearGradient>
  <linearGradient id="blueZone" x2="0" y2="1"><stop stop-color="#eaf4ff"/><stop offset="1" stop-color="#f7fbff"/></linearGradient>
  <linearGradient id="orangeZone" x2="0" y2="1"><stop stop-color="#fff3e6"/><stop offset="1" stop-color="#fffaf5"/></linearGradient>
  <linearGradient id="screen" x2="1" y2="1"><stop stop-color="#19446c"/><stop offset="1" stop-color="#0f243b"/></linearGradient>
  <filter id="shadow" x="-20%" y="-30%" width="140%" height="170%"><feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#1c3554" flood-opacity=".12"/></filter>
  <marker id="orangeArrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 12 6 0 12z" fill="#df741d"/></marker>
  <marker id="greenArrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 12 6 0 12z" fill="#168365"/></marker>
  <symbol id="pc" viewBox="0 0 150 120">
    <path d="M18 8h112a7 7 0 0 1 7 7v70H11V15a7 7 0 0 1 7-7" fill="#43566e"/>
    <rect x="18" y="15" width="112" height="63" rx="2" fill="url(#screen)"/>
    <rect x="26" y="23" width="96" height="7" rx="2" fill="#508db7"/>
    <rect x="26" y="37" width="25" height="32" rx="2" fill="#244f74"/>
    <path d="M59 41h53M59 51h38M59 61h45" stroke="#9ac3dd" stroke-width="4" stroke-linecap="round"/>
    <path d="M63 85h22v15h24v7H39v-7h24z" fill="#a1b3c5"/>
    <path d="M7 85h134v5H7z" fill="#bccbd9"/>
  </symbol>
  <symbol id="server" viewBox="0 0 88 115">
    <path d="M12 10 62 0 82 12v92l-20 11-50-9z" fill="#b5c6d8"/>
    <path d="M12 10h50v105l-50-9z" fill="#e4edf4"/>
    <path d="m62 10 20 2v92l-20 11z" fill="#879eb5"/>
    <rect x="20" y="24" width="33" height="7" rx="2" fill="#6a8198"/>
    <rect x="20" y="38" width="33" height="7" rx="2" fill="#6a8198"/>
    <circle cx="46" cy="87" r="4" fill="#21a77d"/>
  </symbol>
  <marker id="orangeFlow" markerWidth="36" markerHeight="36" refX="31" refY="16" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 32 16 0 32 8 16z" fill="#df741d"/></marker>
  <marker id="greenFlow" markerWidth="36" markerHeight="36" refX="31" refY="16" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 32 16 0 32 8 16z" fill="#168365"/></marker>
  <symbol id="whiteproxy-icon" viewBox="0 0 256 256">
  <rect x="8" y="8" width="240" height="240" rx="54" fill="#26364b"/>
  <g fill="none" stroke="white" stroke-width="12">
    <rect x="100" y="58" width="56" height="140" rx="20"/>
    <path d="M52 128h152 M126 110l18 18-18 18"/>
  </g>
  <g fill="white"><circle cx="52" cy="128" r="12"/><circle cx="204" cy="128" r="12"/></g>
</symbol>
</defs>
<rect width="1400" height="960" rx="24" fill="url(#page)"/>
<g font-family="'Yu Gothic','Meiryo',sans-serif" fill="#20364f">
  <text x="46" y="52" font-size="26" font-weight="700">WhiteProxy</text>
  <text x="46" y="82" font-size="16" fill="#60758b">院内ネットワーク構成例</text>
  <rect x="1094" y="30" width="262" height="36" rx="18" fill="#e4ecf4"/>
  <text x="1225" y="54" text-anchor="middle" font-size="15" font-weight="700">必要な接続先を、必要な時間だけ</text>

  <g filter="url(#shadow)">
    <path d="M589 146c-35 0-51-19-51-42 0-24 19-41 42-41 10-31 37-43 66-31 22-24 64-23 83 6 33-9 60 12 62 38 36-1 58 12 58 36 0 21-18 34-44 34z" fill="#fff" stroke="#adc0d4" stroke-width="2"/>
  </g>
  <text x="694" y="98" text-anchor="middle" font-size="23" font-weight="700">インターネット</text>
  <text x="694" y="125" text-anchor="middle" font-size="14" fill="#60758b">Windows Update・許可したWebサイト</text>
  <text x="737" y="190" font-size="15" fill="#168365" font-weight="700">許可先への通信</text>


  <text x="465" y="360" text-anchor="end" font-size="16" font-weight="700">VLAN間の通信を許可</text>
  <text x="465" y="387" text-anchor="end" font-size="14" fill="#60758b">プロキシー用 TCP 3128</text>
  <text x="465" y="410" text-anchor="end" font-size="14" fill="#60758b">Web管理用 TCP 3129</text>

  <rect x="40" y="440" width="590" height="402" rx="24" fill="url(#blueZone)" stroke="#9bc2e8" stroke-width="2"/>
  <rect x="770" y="440" width="590" height="402" rx="24" fill="url(#orangeZone)" stroke="#ebc498" stroke-width="2"/>
  <rect x="64" y="462" width="90" height="29" rx="14" fill="#2674b8"/>
  <text x="109" y="483" text-anchor="middle" font-size="17" fill="#fff" font-weight="700">VLAN1</text>
  <text x="171" y="485" font-size="23" font-weight="700">インターネット可能ゾーン</text>
  <text x="68" y="519" font-size="16" fill="#58758e">192.168.10.0/24</text>
  <rect x="794" y="462" width="90" height="29" rx="14" fill="#c77d35"/>
  <text x="839" y="483" text-anchor="middle" font-size="17" fill="#fff" font-weight="700">VLAN2</text>
  <text x="901" y="485" font-size="23" font-weight="700">閉鎖電子カルテゾーン</text>
  <text x="798" y="519" font-size="16" fill="#8c725c">192.168.20.0/24</text>

  <!-- 接続開始方向を連続した経路で表示。ルーターを通過する部分は機器の背面へ -->
  <path d="M862 590H780Q750 590 750 560V350Q750 305 720 305H710Q680 305 680 335V560Q680 590 650 590H516" fill="none" stroke="#df741d" stroke-width="10" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#orangeFlow)"/>
  <path d="M516 650H690Q720 650 720 620V158" fill="none" stroke="#168365" stroke-width="10" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#greenFlow)"/>
  <path d="m750 418-13 20h26z" fill="#df741d"/>
  <path d="m680 499-13-20h26z" fill="#df741d"/>
  <path d="m720 418-13 20h26z" fill="#168365"/>
  <g filter="url(#shadow)">
    <path d="m590 240 30-20h180l30 20v72l-24 22H590z" fill="#283e5d"/>
    <path d="m590 240 30-20h180l30 20z" fill="#607b9c"/>
    <path d="M590 240h240v45H590z" fill="#3c5677"/>
    <path d="M590 285h240v27l-24 22H590z" fill="#20324e"/>
    <g fill="#a5b9ca"><rect x="605" y="296" width="19" height="10" rx="2"/><rect x="630" y="296" width="19" height="10" rx="2"/><rect x="655" y="296" width="19" height="10" rx="2"/><rect x="680" y="296" width="19" height="10" rx="2"/></g>
    <circle cx="802" cy="301" r="4" fill="#55d797"/>
    <text x="710" y="270" text-anchor="middle" fill="#fff" font-size="22" font-weight="700">ルーター</text>
  </g>
  <g filter="url(#shadow)"><rect x="86" y="554" width="424" height="164" rx="17" fill="#fff" stroke="#5b9ed2" stroke-width="2"/></g>
  <use href="#pc" x="105" y="576" width="136" height="109"/>
  <rect x="141" y="610" width="62" height="62" rx="15" fill="#fff"/>
  <use href="#whiteproxy-icon" x="144" y="613" width="56" height="56"/>
  <text x="258" y="591" font-size="25" font-weight="700">WhiteProxy</text>
  <text x="258" y="619" font-size="17" fill="#426580">Windows PC</text>
  <text x="258" y="647" font-size="18" font-weight="700">192.168.10.10</text>
  <rect x="258" y="663" width="224" height="31" rx="8" fill="#edf6fd"/>
  <text x="370" y="684" text-anchor="middle" font-size="15" fill="#256c9d">ホスト・端末・時間で許可判定</text>
  <text x="87" y="758" font-size="17" font-weight="700">このPCをVLAN1内に配置します</text>
  <text x="87" y="788" font-size="15" fill="#58758e">待受：192.168.10.10:3128</text>
  <text x="87" y="813" font-size="15" fill="#58758e">VLAN2へ直接つなぐ追加NICは不要</text>

  <g filter="url(#shadow)"><rect x="862" y="554" width="450" height="164" rx="17" fill="#fff" stroke="#d6ad80" stroke-width="2"/></g>
  <use href="#pc" x="885" y="576" width="136" height="109"/>
  <text x="1040" y="592" font-size="22" font-weight="700">利用端末</text>
  <text x="1040" y="625" font-size="18">192.168.20.21</text>
  <text x="1040" y="659" font-size="15" fill="#8c725c">プロキシーを設定して接続</text>
  <text x="1040" y="687" font-size="14" fill="#8c725c">192.168.10.10:3128</text>
  <use href="#server" x="867" y="743" width="60" height="78"/>
  <text x="944" y="765" font-size="17" font-weight="700">院内の電子カルテ</text>
  <text x="944" y="792" font-size="14" fill="#8c725c">院内通信は既存の構成を維持</text>
  <text x="944" y="816" font-size="14" fill="#8c725c">Web管理端末もVLAN2に配置可能</text>

  <rect x="40" y="868" width="1320" height="68" rx="15" fill="#fff" stroke="#d9e3ee"/>
  <path d="M65 891h48" stroke="#df741d" stroke-width="6" marker-end="url(#orangeArrow)"/>
  <text x="129" y="897" font-size="16" font-weight="700" fill="#b95d14">端末 → ルーター → WhiteProxy</text>
  <path d="M510 891h48" stroke="#168365" stroke-width="6" marker-end="url(#greenArrow)"/>
  <text x="574" y="897" font-size="16" font-weight="700" fill="#168365">WhiteProxy → ルーター → インターネット</text>
  <text x="65" y="922" font-size="12" fill="#60758b">矢印は通信の流れ（要求方向・応答は省略）。ルーターでは必要なVLAN間通信を許可し、VLAN2からの直接外部通信を遮断します。</text>
  <text x="1327" y="920" text-anchor="end" font-size="13" fill="#7b8d9e">構成例 / IPv4</text>
</g>
</svg>
